
spring.application.name=etudiant-service

# Server
server.port=8082

# MySQL - Etudiant Database
spring.datasource.url=jdbc:mysql://localhost:3306/etudiant_db
spring.datasource.username=root
spring.datasource.password=Password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=etudiant-filiere-projection
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JWT - Auth Service
security.issuer=http://localhost:9100
security.jwks-uri=http://localhost:9100/.well-known/jwks.json
